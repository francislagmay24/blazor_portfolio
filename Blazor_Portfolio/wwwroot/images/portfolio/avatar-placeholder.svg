<?xml version="1.0" encoding="UTF-8"?>
<!--
  HEADSHOT / AVATAR PLACEHOLDER
  -----------------------------
  Replace this file with a real photo, or point About:AvatarPath in
  portfolio.json somewhere else under wwwroot/.
  A square image (at least 400×400) works best.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Avatar placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b6ec2" />
      <stop offset="1" stop-color="#123a6b" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" />
  <circle cx="200" cy="155" r="62" fill="#ffffff" fill-opacity="0.85" />
  <path d="M76 400c0-68 56-118 124-118s124 50 124 118z" fill="#ffffff" fill-opacity="0.85" />
  <rect x="8" y="8" width="384" height="384" rx="18"
        fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4" stroke-dasharray="16 12" />
  <text x="200" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="16" fill="#ffffff" fill-opacity="0.9" letter-spacing="2">
    YOUR PHOTO
  </text>
</svg>